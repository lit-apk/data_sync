name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.storePassword }}
      KEY_PASSWORD: ${{ secrets.keyPassword }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Configure signing
        run: |
          mkdir -p sign
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sign/release.keystore
          cat > keystore.properties <<EOF
          storeFile=sign/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=data-sync
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew test assembleRelease lint

      - name: Verify signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: if this tag already has a release (re-run or duplicate tag push),
          # replace its APK instead of failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              app/build/outputs/apk/release/app-release.apk
          fi
